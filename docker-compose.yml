version: '3.8'

services:
  api:
    build: .
    container_name: fastapi-app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:123456@10.20.40.26:3306/fastapi_study?charset=utf8mb4
      - SECRET_KEY=your-production-secret-key
      - DEBUG=false
    volumes:
      - ./app:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000